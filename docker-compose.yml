name: policymesh

services:
  mysql:
    image: mysql:8.4
    container_name: policymesh-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-policymeshdb}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - policymesh-mysql-data:/var/lib/mysql
      - ./infrastructure/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [policymesh-network]

  redis:
    image: redis:7
    container_name: policymesh-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - policymesh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [policymesh-network]
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: policymesh-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:29092"
    volumes:
      - policymesh-kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks: [policymesh-network]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: policymesh-backend
    environment:
      SERVER_PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-policymeshdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-policymeshdb}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-at-least-32-characters}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_SERVICE_MODE: ${AI_SERVICE_MODE:-local}
      AI_SERVICE_URL: http://ai-service:${AI_SERVICE_PORT:-8000}
      POLICYMESH_REDIS_ENABLED: ${POLICYMESH_REDIS_ENABLED:-true}
      POLICYMESH_REDIS_TTL_SECONDS: ${REDIS_POLICY_TTL_SECONDS:-600}
      POLICYMESH_KAFKA_ENABLED: ${POLICYMESH_KAFKA_ENABLED:-false}
      POLICYMESH_DEMO_SEED: ${POLICYMESH_DEMO_SEED:-false}
      POLICYMESH_DEMO_SEED_ENDPOINT: ${POLICYMESH_DEMO_SEED_ENDPOINT:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [policymesh-network]
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    container_name: policymesh-ai-service
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      POLICYMESH_BACKEND_URL: http://backend:${BACKEND_PORT:-8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      MAX_FIELDS: ${MAX_FIELDS:-100}
      MAX_SAMPLE_VALUE_LENGTH: ${MAX_SAMPLE_VALUE_LENGTH:-500}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [policymesh-network]
    restart: unless-stopped

networks:
  policymesh-network:
    name: policymesh-network

volumes:
  policymesh-mysql-data:
  policymesh-redis-data:
  policymesh-kafka-data:
