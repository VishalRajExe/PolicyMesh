name: policymesh

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policymesh}
      POSTGRES_USER: ${POSTGRES_USER:-policymesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - policymesh-postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [policymesh-network]
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - policymesh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [policymesh-network]
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:29092"
    volumes:
      - policymesh-kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks: [policymesh-network]
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../docker/kafka/topics.sh:/scripts/topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [policymesh-network]
    restart: "no"

  backend:
    build:
      context: ../../backend
    environment:
      SERVER_PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-policymesh}
      DATABASE_USERNAME: ${POSTGRES_USER:-policymesh}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env/.env}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in env/.env (min 32 chars)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_SERVICE_MODE: ${AI_SERVICE_MODE:-local}
      AI_SERVICE_URL: http://ai-service:${AI_SERVICE_PORT:-8000}
      POLICYMESH_REDIS_ENABLED: ${POLICYMESH_REDIS_ENABLED:-true}
      POLICYMESH_KAFKA_ENABLED: ${POLICYMESH_KAFKA_ENABLED:-false}
      POLICYMESH_DEMO_SEED: ${POLICYMESH_DEMO_SEED:-false}
      POLICYMESH_DEMO_SEED_ENDPOINT: ${POLICYMESH_DEMO_SEED_ENDPOINT:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [policymesh-network]
    restart: unless-stopped

  ai-service:
    build:
      context: ../../ai-service
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      POLICYMESH_BACKEND_URL: http://backend:${BACKEND_PORT:-8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      MAX_FIELDS: ${MAX_FIELDS:-100}
      MAX_SAMPLE_VALUE_LENGTH: ${MAX_SAMPLE_VALUE_LENGTH:-500}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [policymesh-network]
    restart: unless-stopped

networks:
  policymesh-network:
    name: policymesh-network

volumes:
  policymesh-postgres-data:
  policymesh-redis-data:
  policymesh-kafka-data:
