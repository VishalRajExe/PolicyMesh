# Dependabot configuration for PolicyMesh
# Only ecosystems actually present in the repository:
#   - maven           backend/pom.xml, ci-checker/pom.xml
#   - pip             ai-service/requirements.txt
#   - github-actions  .github/workflows/
#   - docker          backend/Dockerfile, ai-service/Dockerfile
# (npm is intentionally omitted — no frontend exists yet.)
#
# Updates are grouped per ecosystem to keep the number of PRs low.

version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-backend:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /ci-checker
    schedule:
      interval: weekly
    groups:
      maven-ci-checker:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
    groups:
      pip-ai-service:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker-backend:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /ai-service
    schedule:
      interval: weekly
    groups:
      docker-ai-service:
        patterns:
          - "*"
