policy:
  id: EU-PII-001
  name: EU PII Protection
  version: 1
  status: ACTIVE

  jurisdiction: EU
  dataClass: PII

  description: >
    EU personal data must remain within approved EU regions
    unless an explicitly configured exception exists.
    This is a technical demonstration policy and is not legal advice.

  allowedRegions:
    - EU

  deniedRegions:
    - US
    - CN

  enforcement:
    ci: true
    runtime: true

  defaultDecision: DENY
