spring.datasource.url=jdbc:h2:mem:policymesh_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

policymesh.redis.enabled=false
policymesh.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:19092

policymesh.jwt.secret=test-secret-key-for-unit-and-integration-tests-only-not-for-prod
policymesh.jwt.expiration-ms=3600000

policymesh.seed.enabled=false
