spring.application.name=policymesh

# ---------- Datasource ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/policymesh}
spring.datasource.username=${DB_USERNAME:policymesh}
spring.datasource.password=${DB_PASSWORD:policymesh}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
policymesh.redis.enabled=${REDIS_ENABLED:true}

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
policymesh.kafka.enabled=${KAFKA_ENABLED:true}

# ---------- JWT ----------
policymesh.jwt.secret=${JWT_SECRET:change-this-super-secret-key-please-override-in-env-min-256-bits}
policymesh.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- AI Service ----------
policymesh.ai.service-url=${AI_SERVICE_URL:}

# ---------- Policy Engine ----------
policymesh.policy.default-decision=${POLICY_DEFAULT_DECISION:ALLOW}

# ---------- Server ----------
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never

# ---------- Logging ----------
logging.level.com.policymesh=INFO
