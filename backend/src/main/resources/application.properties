# Spring Boot Application Configuration
spring.application.name=policymesh-backend

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/policymesh
spring.datasource.username=policymesh
spring.datasource.password=policymesh
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=policymesh-group
spring.kafka.auto-offset-reset=earliest

# JWT Configuration
app.jwt-secret=policymesh-secret-key-change-in-production
app.jwt-expiration-ms=86400000

# API Base Path
api.prefix=/api/v1