spring.application.name=policymesh-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL is the source of truth for every compliance-relevant fact.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/policymesh}
spring.datasource.username=${DATABASE_USERNAME:policymesh}
spring.datasource.password=${DATABASE_PASSWORD:policymesh}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Redis only accelerates compiled-policy lookups; the app stays fully correct without it.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false
policymesh.redis.enabled=${POLICYMESH_REDIS_ENABLED:true}

# Kafka is opt-in async notification; never on the critical path.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
policymesh.kafka.enabled=${POLICYMESH_KAFKA_ENABLED:false}

# Security. Do not rely on the defaults anywhere outside local development.
app.jwt-secret=${JWT_SECRET:change-this-development-secret-at-least-32-characters}
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# AI classification: local heuristic by default, remote FastAPI service when mode=remote.
policymesh.ai.mode=${AI_SERVICE_MODE:local}
policymesh.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}

# Demo data
policymesh.demo.seed=${POLICYMESH_DEMO_SEED:false}
policymesh.demo.seed-endpoint-enabled=${POLICYMESH_DEMO_SEED_ENDPOINT:true}

# Expose only the health endpoint (referenced by docs/LOCAL_DEVELOPMENT.md).
management.endpoints.web.exposure.include=health
