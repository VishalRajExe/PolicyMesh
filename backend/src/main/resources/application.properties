spring.application.name=policymesh-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:policymeshdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Redis only accelerates compiled-policy lookups; the app stays fully correct without it.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false
policymesh.redis.enabled=${POLICYMESH_REDIS_ENABLED:true}
policymesh.redis.ttl-seconds=${REDIS_POLICY_TTL_SECONDS:600}

# Kafka is opt-in async notification; never on the critical path.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
policymesh.kafka.enabled=${POLICYMESH_KAFKA_ENABLED:false}

# Security. Do not rely on the defaults anywhere outside local development.
app.jwt-secret=${JWT_SECRET:change-this-development-secret-at-least-32-characters}
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# AI classification: remote FastAPI service by default with local heuristic fallback.
policymesh.ai.mode=${AI_SERVICE_MODE:remote}
policymesh.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}

# Demo data
policymesh.demo.seed=${POLICYMESH_DEMO_SEED:false}
policymesh.demo.seed-endpoint-enabled=${POLICYMESH_DEMO_SEED_ENDPOINT:true}

# Health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
management.health.db.enabled=true
