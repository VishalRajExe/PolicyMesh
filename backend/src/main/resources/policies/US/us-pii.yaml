policy:
  id: US-PII-001
  name: US PII Protection
  version: 1
  status: ACTIVE

  jurisdiction: US
  dataClass: PII

  description: >
    Demonstration policy for US-origin PII. Enforces that
    personal data originating in the US remains within
    approved regions. This is a technical demonstration
    policy and is not legal advice.

  allowedRegions:
    - US
    - EU

  deniedRegions:
    - CN

  enforcement:
    ci: true
    runtime: true

  defaultDecision: DENY
