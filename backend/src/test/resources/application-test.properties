spring.datasource.url=jdbc:h2:mem:policymesh_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
policymesh.redis.enabled=false
policymesh.kafka.enabled=false
app.jwt-secret=change-this-development-secret-at-least-32-characters
